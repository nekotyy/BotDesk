name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix, for example 1.1.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build installer and portable
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: botdesk-windows
          path: |
            release/BotDesk-Portable-*.exe
            release/BotDesk-Setup-*.exe
          if-no-files-found: error

      - name: Prepare release metadata
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "RELEASE_TAG=v${{ inputs.version }}" >> $env:GITHUB_ENV
            "RELEASE_NAME=BotDesk v${{ inputs.version }}" >> $env:GITHUB_ENV
            "RELEASE_PRERELEASE=false" >> $env:GITHUB_ENV
            "RELEASE_MAKE_LATEST=true" >> $env:GITHUB_ENV
          } elseif ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true") {
            "RELEASE_TAG=${{ github.ref_name }}" >> $env:GITHUB_ENV
            "RELEASE_NAME=BotDesk ${{ github.ref_name }}" >> $env:GITHUB_ENV
            "RELEASE_PRERELEASE=false" >> $env:GITHUB_ENV
            "RELEASE_MAKE_LATEST=true" >> $env:GITHUB_ENV
          } elseif ("${{ github.ref_name }}" -eq "main") {
            "RELEASE_TAG=latest" >> $env:GITHUB_ENV
            "RELEASE_NAME=BotDesk latest" >> $env:GITHUB_ENV
            "RELEASE_PRERELEASE=false" >> $env:GITHUB_ENV
            "RELEASE_MAKE_LATEST=false" >> $env:GITHUB_ENV
          } else {
            "RELEASE_TAG=dev-latest" >> $env:GITHUB_ENV
            "RELEASE_NAME=BotDesk dev latest" >> $env:GITHUB_ENV
            "RELEASE_PRERELEASE=true" >> $env:GITHUB_ENV
            "RELEASE_MAKE_LATEST=false" >> $env:GITHUB_ENV
          }

      - name: Move rolling release tag
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $env:RELEASE_TAG $env:GITHUB_SHA
          git push origin "refs/tags/$env:RELEASE_TAG" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          make_latest: ${{ env.RELEASE_MAKE_LATEST }}
          files: |
            release/BotDesk-Portable-*.exe
            release/BotDesk-Setup-*.exe
